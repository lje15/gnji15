<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5반 쉼표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 전자칠판 가로 한 화면 — 위 탭줄, 아래 게임 무대. 크레용 테두리, 파스텔은 넓은 면에. 한 가지 밝은 화면으로 고정 */
:root{
  --paper:#FAF8F6;
  --white:#FFFFFF;
  --ink:#2F2A35;
  --muted:#6E6774;
  --line:#D9D2DA;
  --peach:#FFDCC9;
  --sky:#CFE2F4;
  --mint:#D3EDDB;
  --lav:#E2DAF3;
  --lemon:#F8EDBF;
  --rose:#F7D2DB;
  --good:#3C8A5B;
  --good-bg:#BFE6CC;
  --amber:#7A5A00;
  --amber-bg:#F2DC86;
  --bad:#C4553F;
  --display:"Gowun Batang","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --num:"Gowun Batang","Times New Roman",serif;
  --math:var(--num);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default;opacity:.45}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.sketch{position:relative;isolation:isolate;background:none;border:0}
.sketch::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--fill,transparent);
  border:2.5px solid var(--ink);border-radius:16px 22px 14px 24px / 22px 14px 24px 16px;filter:url(#crayon)}
.f-peach{--fill:var(--peach)}.f-sky{--fill:var(--sky)}.f-mint{--fill:var(--mint)}.f-lav{--fill:var(--lav)}
.f-lemon{--fill:var(--lemon)}.f-rose{--fill:var(--rose)}.f-paper{--fill:var(--paper)}.f-white{--fill:var(--white)}

.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
header{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--display);font-size:clamp(24px,2vw,34px);margin:0;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.brand .sub{font-family:var(--display);font-weight:700;color:var(--ink);font-size:clamp(15px,1.2vw,19px)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tg{font-size:13px;color:var(--muted);font-weight:700;margin:0 2px 0 10px;letter-spacing:.04em}
.tg:first-child{margin-left:0}
.tab{padding:8px 12px;font-size:clamp(15px,1.15vw,19px);font-weight:500;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.tab small{font-size:.68em;color:var(--muted);font-weight:400}
.tab[aria-selected="true"]{font-weight:700}
.tab[aria-selected="false"]::before{border-color:var(--line);--fill:transparent}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.clock b{font-family:var(--num);font-size:clamp(24px,2vw,34px);font-variant-numeric:tabular-nums}
.clock span{font-size:12px;color:var(--muted)}
.fs-btn{padding:9px 16px;font-size:clamp(14px,1.05vw,17px)}

.stage{padding:clamp(14px,1.8vw,28px);display:flex;flex-direction:column;gap:clamp(10px,1.3vh,18px);min-height:0;overflow:auto}
.ghead{display:flex;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.ghead h2{font-family:var(--display);font-size:clamp(24px,2.2vw,38px);margin:0}
.ghead p{margin:0;color:var(--muted);font-size:clamp(14px,1.1vw,19px);flex:1;min-width:16em}
.opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg .lb{font-size:14px;color:var(--muted);margin-right:2px}
.seg button{padding:7px 14px;font-size:clamp(14px,1.05vw,17px)}
.seg button[aria-pressed="false"]::before{border-color:var(--line);--fill:transparent}
.seg button[aria-pressed="true"]{font-weight:700}
.btn{padding:10px 20px;font-weight:500;font-size:clamp(15px,1.2vw,20px)}
.btn.big{padding:14px 30px;font-size:clamp(18px,1.6vw,26px);font-weight:700}
.ghost::before{border-color:var(--line)!important}
.armed{color:var(--bad);font-weight:700}

/* 숫자 키패드 */
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.keys button{min-height:clamp(52px,7vh,84px);font-family:var(--num);font-size:clamp(24px,2.4vw,40px)}
.keys button.fn{font-family:var(--body);font-size:clamp(15px,1.25vw,21px);font-weight:500}

/* 숫자야구 */
.bb{flex:1;min-height:0;display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.bb.duel{grid-template-columns:minmax(0,1fr) minmax(0,.95fr) minmax(0,1fr)}
.bb-pad{display:flex;flex-direction:column;gap:12px;justify-content:center;min-width:0}
.turn{font-family:var(--display);font-size:clamp(20px,1.9vw,32px);font-weight:700;text-align:center}
.slots{display:flex;gap:10px;justify-content:center}
.slot{width:clamp(50px,4.8vw,84px);height:clamp(62px,7.5vh,100px);display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:clamp(34px,3.4vw,58px);border-bottom:4px solid var(--ink)}
.msg{text-align:center;min-height:1.5em;color:var(--muted);font-size:clamp(14px,1.1vw,18px)}
.bb-team{display:flex;flex-direction:column;gap:10px;padding:16px 18px;min-height:0;min-width:0}
.bb-team.cur::before{border-width:5px}
.tt{display:flex;gap:6px 12px;align-items:baseline;flex-wrap:wrap}
.tt b{font-family:var(--display);font-size:clamp(20px,1.8vw,30px)}
.tt span{color:var(--muted)}
.tt .ok{color:var(--good);font-weight:700}
.memo{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.memo button{padding:5px 0;font-family:var(--num);font-size:clamp(16px,1.3vw,22px);border:1.5px solid var(--line);border-radius:8px;background:var(--white)}
.memo .x{text-decoration:line-through;color:var(--muted);background:var(--line)}
.memo .o{background:var(--good-bg);border-color:var(--good);font-weight:700}
.memo-h{font-size:13px;color:var(--muted);margin-top:-4px}
.hist{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:90px}
.hist li{display:grid;grid-template-columns:2.2em auto 1fr;gap:12px;align-items:center;padding:5px 4px;border-bottom:1px solid var(--line)}
.hist li.empty{display:block;color:var(--muted);border:0}
.hn{font-family:var(--num);color:var(--muted)}
.hg{font-family:var(--num);font-size:clamp(24px,2.2vw,38px);letter-spacing:.14em}
.hr{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.c{font-style:normal;font-weight:700;padding:2px 12px;border-radius:999px;font-size:clamp(15px,1.25vw,21px);white-space:nowrap}
.c.s{background:var(--good-bg);color:var(--good)}
.c.b{background:var(--amber-bg);color:var(--amber)}
.c.out{background:var(--rose);color:var(--bad)}
.c.win{background:var(--good);color:var(--white)}
.bbans{font-family:var(--num);font-size:clamp(20px,1.7vw,28px);color:var(--bad)}
.result{padding:16px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.result b{font-family:var(--display);font-size:clamp(24px,2.3vw,40px)}

/* 오목 */
.om{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(220px,21vw,330px);gap:18px}
.om-box{display:flex;align-items:center;justify-content:center;min-height:300px;padding:10px;min-width:0}
#omCv{display:block;touch-action:none;max-width:100%}
.side{display:flex;flex-direction:column;gap:14px;padding:18px;min-width:0}
.side h3{font-family:var(--display);margin:0;font-size:clamp(20px,1.7vw,28px)}
.stone{display:inline-block;width:.95em;height:.95em;border-radius:50%;border:2px solid var(--ink);vertical-align:-.1em;margin-right:.3em}
.stone.b{background:var(--ink)}.stone.w{background:var(--white)}
.big-turn{font-family:var(--display);font-size:clamp(26px,2.4vw,40px);font-weight:700}
.tally{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:clamp(16px,1.3vw,21px)}
.tally b{font-family:var(--num);font-size:1.3em;font-variant-numeric:tabular-nums}
.side .btns{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.note{font-size:13px;color:var(--muted);margin:0}

/* 추리하기 */
.lwrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(16px,2vw,32px);align-items:start}
.lleft,.lright{display:flex;flex-direction:column;gap:14px;min-width:0}
.setup{padding:14px 18px;font-size:clamp(14px,1.1vw,18px);line-height:1.55}
.setup b{font-family:var(--display)}
.setup ul{margin:4px 0 0;padding-left:1.1em}
.conds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lc{display:grid;grid-template-columns:2em 1fr auto;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 4px;font-size:clamp(15px,1.25vw,21px);line-height:1.45}
.lc .ln{font-family:var(--math);color:var(--muted)}
.lc.used .lt{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.lc.bad{background:color-mix(in srgb,var(--rose) 55%,transparent)}
.bd{font-size:.78em;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.bd.t{background:var(--good-bg);color:var(--good)}.bd.f{background:var(--rose);color:var(--bad)}.bd.u{background:var(--line);color:var(--muted)}
.lgrid{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed}
.lgrid thead th:first-child{width:6.5em}
.lgrid th{font-weight:500;color:var(--muted);font-size:clamp(13px,1vw,17px);text-align:center;white-space:nowrap}
.lgrid tbody th{text-align:right;padding-right:6px}
.lcell{width:100%;min-height:clamp(52px,4.6vw,78px);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(16px,1.45vw,25px);font-weight:500;padding:4px}
.lcell.lnone{color:var(--line)}
.lcell.lsel::before{border-width:5px}
.lcell s{font-size:.62em;color:var(--bad);font-weight:400}
.lcell.lwrong::before{border-color:var(--bad);border-width:4px}
.lcell.lempty::before{border-style:dashed}
.palette{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.palette .pl-h{width:100%;font-family:var(--display);font-weight:700;font-size:clamp(15px,1.2vw,20px)}
.palette button{padding:10px 18px;font-size:clamp(16px,1.35vw,23px);font-weight:500;display:flex;flex-direction:column;align-items:center}
.palette button small{font-size:.6em;color:var(--muted);font-weight:400}
.palette button.taken{color:var(--muted)}
.pl-tip{margin:0;color:var(--muted);font-size:clamp(14px,1.05vw,17px)}
.chk{color:var(--muted);align-self:center;font-size:clamp(14px,1.1vw,18px)}
.steps{padding:16px 22px;font-size:clamp(15px,1.25vw,21px);line-height:1.6}
.steps b{font-family:var(--display)}
.steps ol{margin:6px 0 0;padding-left:1.3em}
.steps .note{margin:8px 0 0;color:var(--muted);font-size:.85em}
@media (max-width:900px){.lwrap{grid-template-columns:1fr}}
.res-top{display:flex;align-items:center;gap:clamp(16px,2.4vw,40px);flex-wrap:wrap}
.lbig{font-family:var(--math);font-size:clamp(56px,7vw,120px);line-height:1;font-variant-numeric:tabular-nums}
.lbig small{font-size:.32em;color:var(--muted)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chips span{padding:8px 16px;font-size:clamp(15px,1.3vw,21px);font-weight:500}
.rwrap{overflow-x:auto;min-width:0}
.locked{padding:clamp(16px,1.8vw,26px) clamp(18px,2vw,30px);font-size:clamp(17px,1.4vw,24px)}
.steps{padding:16px 22px;font-size:clamp(15px,1.25vw,21px);line-height:1.6}
.steps b{font-family:var(--display)}
.steps ol{margin:6px 0 0;padding-left:1.3em}
.steps .note{margin:8px 0 0;color:var(--muted);font-size:.85em}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.ctrl button{padding:12px 22px;font-size:clamp(16px,1.25vw,21px);font-weight:500}
.ctrl .reveal{font-weight:700;margin-left:auto}
.rounds{display:flex;gap:8px;flex-wrap:wrap}
.rounds button{padding:8px 16px;font-size:clamp(14px,1.1vw,18px)}
.rounds button[aria-pressed="false"]::before{border-color:var(--line);--fill:transparent}
.lgrid{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed}
.f-white{--fill:#FFFFFF}
.rule{margin:0;color:var(--muted);font-size:clamp(15px,1.2vw,20px)}
.ghead .count{font-family:var(--math);color:var(--muted);font-size:clamp(16px,1.3vw,22px);font-variant-numeric:tabular-nums;margin-left:auto}
.chk{color:var(--muted);align-self:center;font-size:clamp(14px,1.1vw,18px)}

/* 두뇌 퀴즈 */
.bq-top{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.bq-dots{display:flex;gap:6px;flex-wrap:wrap}
.bq-dot{width:clamp(32px,2.4vw,42px);height:clamp(32px,2.4vw,42px);border-radius:50%;border:2px solid var(--line);background:transparent;font-family:var(--num);font-size:clamp(13px,1vw,17px);color:var(--muted);padding:0}
.bq-dot.done{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.bq-dot.cur{border-color:var(--ink);color:var(--ink);font-weight:700;border-width:3px}
.bq{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.bq-card{padding:clamp(18px,2.2vw,34px);display:flex;flex-direction:column;gap:clamp(12px,1.8vh,22px);min-width:0}
.bq-cat{display:flex;gap:12px;align-items:center}
.bq-cat span{padding:4px 14px;font-weight:700;font-size:clamp(14px,1.1vw,18px)}
.bq-cat b{font-family:var(--num);font-size:clamp(22px,1.8vw,30px)}
.bq-q{margin:0;font-size:clamp(19px,1.7vw,29px);font-weight:500;line-height:1.55;text-wrap:pretty}
.qm{color:var(--bad);font-weight:700}
.bq-seq{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-family:var(--num);font-size:clamp(38px,4.2vw,72px)}
.bq-seq i{font-style:normal;color:var(--muted);font-size:.6em}
.bq-lines{display:flex;flex-direction:column;align-items:center;font-family:var(--num);font-size:clamp(26px,2.6vw,44px);line-height:1.35;letter-spacing:.12em}
.bq-pairs{display:grid;grid-template-columns:auto auto auto;justify-content:center;gap:4px 18px;font-family:var(--num);font-size:clamp(28px,2.8vw,48px);line-height:1.3}
.bq-pairs span:nth-child(3n+1){text-align:right}
.bq-pairs span:nth-child(3n+2){color:var(--muted)}
.bq-match{display:flex;flex-direction:column;align-items:center;gap:14px}
.mt{width:min(100%,520px);height:auto}
.mt-sol{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.mt-sol span{font-weight:700;color:var(--good)}
.bq-grid{display:grid;grid-template-columns:repeat(3,clamp(64px,7vh,96px));grid-auto-rows:clamp(64px,7vh,96px);justify-content:center}
.bq-grid span{border:2px solid var(--ink);margin:-1px;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:clamp(28px,3.2vh,44px);background:var(--white)}
.bq-tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.bq-tiles span{width:clamp(56px,5vw,84px);height:clamp(56px,5vw,84px);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:clamp(28px,2.8vw,46px)}
.bq-dice{display:flex;flex-direction:column;align-items:center}
.bq-dice span{width:clamp(56px,6vh,80px);height:clamp(56px,6vh,80px);border:2.5px solid var(--ink);border-radius:10px;margin-top:-2.5px;background:var(--white);display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:clamp(24px,3vh,36px)}
.bq-text{margin:0;color:var(--muted);font-size:clamp(15px,1.25vw,21px)}
.bq-hint{margin:0;border-left:4px solid var(--good);padding-left:12px;font-size:clamp(16px,1.35vw,23px)}
.bq-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.bq-opts{display:grid;grid-template-columns:1fr;gap:10px}
.bq-opt{display:flex;align-items:center;gap:14px;text-align:left;padding:clamp(10px,1.4vh,18px) 18px;font-size:clamp(17px,1.45vw,25px);font-weight:500}
.bq-opt .k{font-family:var(--num);color:var(--muted);width:1.2em;flex:none}
.bq-opt.sel::before{border-width:5px;--fill:var(--lemon)}
.bq-opt.right::before{--fill:var(--good-bg);border-color:var(--good);border-width:5px}
.bq-opt.wrong::before{border-color:var(--bad);border-style:dashed}
.bq-opt:disabled{opacity:1}
.bq-fb{font-family:var(--display);font-weight:700;font-size:clamp(22px,2vw,34px)}
.bq-fb.ok{color:var(--good)}.bq-fb.no{color:var(--bad)}
.steps p{margin:6px 0 0}
.bq-nav{display:flex;gap:10px;justify-content:space-between;margin-top:auto}
.bq-reset{align-self:flex-start;font-size:14px;padding:6px 12px}
.bq .ctrl{margin-top:0}


[hidden]{display:none!important}
/* 랭킹 · 제한 시간 */
.rk-btn small{font-size:.68em;color:var(--bad);font-weight:500}
.gtime{font-family:var(--body);font-weight:700;font-size:clamp(15px,1.2vw,20px);padding:6px 14px;border-radius:999px;background:var(--mint);color:var(--good);font-variant-numeric:tabular-nums;white-space:nowrap}
.gtime.over{background:var(--rose);color:var(--bad)}
.ov{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 38%,transparent);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov-box{width:min(720px,100%);max-height:100%;overflow:auto;padding:24px 26px;display:flex;flex-direction:column;gap:12px}
.ov-box h3{font-family:var(--display);font-size:clamp(24px,2.2vw,36px);margin:0}
.ov-box p{margin:0;font-size:clamp(15px,1.2vw,19px)}
.ov-box .slots{margin:4px 0}
.ov-box .keys button{min-height:clamp(46px,5.5vh,64px);font-size:clamp(22px,2vw,32px)}
.ov-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.rk-games button{padding:6px 12px;font-size:14px}
.ovwarn{margin:0;padding:8px 14px;border-radius:10px;background:var(--rose);color:var(--bad);font-weight:700;font-size:clamp(16px,1.3vw,20px)}
.note.warn{color:var(--bad);font-weight:500}
.rk{list-style:none;margin:0;padding:0}
.rk li{display:grid;grid-template-columns:2.2em 4.5em 1fr;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:clamp(16px,1.3vw,21px);align-items:baseline}
.rk li .r{font-family:var(--num);color:var(--muted)}
.rk li .t{text-align:right;font-variant-numeric:tabular-nums}
.rk li:nth-child(-n+3) .r{color:var(--ink);font-weight:700}
.rk li.me{background:var(--lemon)}
.rk li.empty{display:block;color:var(--muted)}
.rtab{width:100%;border-collapse:collapse;font-size:clamp(14px,1.15vw,19px)}
.rtab th{text-align:left;font-weight:500;color:var(--muted);padding:6px 10px;border-bottom:2px solid var(--ink)}
.rtab td{padding:8px 10px;border-bottom:1px solid var(--line)}
.ox{font-family:var(--num);font-size:1.4em;font-weight:700}.ox.o{color:var(--good)}.ox.x{color:var(--bad)}
.bq-dot{display:inline-flex;align-items:center;justify-content:center}
.bq-dot.miss{background:var(--rose);border-color:var(--bad);color:var(--ink)}
.bqr-ready{padding:22px 26px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;font-size:clamp(16px,1.35vw,22px);max-width:820px}
.bqr-ready b{font-family:var(--display);font-size:1.4em}
.bqr-ready ul{margin:0;padding-left:1.2em;line-height:1.7}

/* 네모 로직 */
.nn-wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(220px,21vw,320px);gap:18px}
.nn-board{display:flex;align-items:center;justify-content:center;min-width:0;overflow:auto}
.nn{border-collapse:collapse}
.nn th{font-family:var(--num);font-weight:700;color:var(--ink);font-size:calc(var(--cs) * .4);line-height:1.15}
.nn thead th{vertical-align:bottom;text-align:center;padding:0 0 2px}
.nn .cc,.nn .rc{background:var(--lav)}
.nn .rc{text-align:right;padding:0 10px 0 8px;white-space:nowrap}
.nn .ok{color:var(--muted);opacity:.45;background:var(--paper)}
.nn td{width:var(--cs);height:var(--cs);padding:0;border:1px solid var(--line)}
.nn td.b5,.nn th.b5{border-right:2.5px solid var(--ink)}
.nn tr td.b5r,.nn tr .b5r{border-bottom:2.5px solid var(--ink)}
.nn tbody{border:2.5px solid var(--ink)}
.nc{width:100%;height:100%;border:0;background:var(--white);padding:0;display:block;touch-action:manipulation}
.nc.on{background:var(--ink)}
.nc.x{background:var(--white);position:relative}
.nc.x::after{content:"×";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:calc(var(--cs) * .6);line-height:1}
.nc:disabled{opacity:1;cursor:default}

/* 하노이의 탑 */
.hn-info{display:flex;gap:10px 22px;align-items:baseline;flex-wrap:wrap;font-size:clamp(17px,1.4vw,24px)}
.hn-info b{font-family:var(--num);font-size:1.6em}
.hn-msg{color:var(--bad);font-weight:500}
.hn-msg.ok{color:var(--good);font-weight:700}
.hn{flex:1;min-height:260px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.hn-peg{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:transparent;border:2px dashed transparent;border-radius:18px;padding:16px 10px 44px}
.hn-peg.sel{border-color:var(--ink);background:var(--lemon)}
.hn-peg .rod{position:absolute;left:50%;transform:translateX(-50%);bottom:44px;top:14%;width:12px;border-radius:6px;background:var(--ink);opacity:.75}
.hn-peg .stack{position:relative;display:flex;flex-direction:column-reverse;align-items:center;width:100%;gap:4px;z-index:1}
.disk{height:clamp(26px,4.6vh,48px)}
.disk.lift{transform:translateY(-24px)}
.hn-peg .base{position:absolute;left:6%;right:6%;bottom:36px;height:10px;border-radius:5px;background:var(--ink)}
.hn-peg .lbl{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:var(--muted);font-size:clamp(14px,1.1vw,18px)}
.hn-peg:disabled{opacity:1}

/* 점과 선 */
.dt-wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(220px,21vw,320px);gap:18px}
.dt-board{display:flex;align-items:center;justify-content:center;min-width:0;overflow:auto}
.dt{display:grid}
.dd{background:var(--ink);border-radius:50%}
.de{border:0;background:transparent;padding:0;position:relative;touch-action:manipulation}
.de::after{content:"";position:absolute;background:var(--line);border-radius:6px;opacity:.5}
.de.h::after{left:0;right:0;top:35%;bottom:35%}
.de.v::after{top:0;bottom:0;left:35%;right:35%}
.de.pend::after{opacity:1;background:repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 14px)}
.de.v.pend::after{background:repeating-linear-gradient(0deg,var(--ink) 0 8px,transparent 8px 14px)}
.de.on::after{opacity:1;background:var(--ink)}
.de.last::after{background:var(--bad)}
.de:disabled{cursor:default;opacity:1}
.db{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:calc(var(--L) * .26);border-radius:6px;margin:4px}
.db.p0{background:var(--peach)}.db.p1{background:var(--sky)}
.sw{display:inline-block;width:.9em;height:.9em;border-radius:3px;border:1.5px solid var(--ink);margin-right:.35em;vertical-align:-.08em}
.sw.p0{background:var(--peach)}.sw.p1{background:var(--sky)}


/* 수업 알림 */
.bell-banner{position:fixed;z-index:70;top:max(14px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center;
  padding:16px 18px 16px 28px;background:var(--ink);color:var(--white);border-radius:18px;box-shadow:0 8px 30px color-mix(in srgb,var(--ink) 35%,transparent);max-width:calc(100% - 32px)}
.bell-banner b{font-family:var(--display);font-size:clamp(22px,2.4vw,40px)}
.bell-banner .btn{color:var(--ink)}
.bell{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--ink) 55%,transparent);display:flex;align-items:center;justify-content:center;padding:16px}
.bell-box{width:min(820px,100%);padding:clamp(26px,4vh,52px) clamp(24px,3vw,48px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.bell-k{margin:0;font-weight:700;letter-spacing:.2em;color:var(--bad)}
.bell-box h2{font-family:var(--display);font-size:clamp(34px,4.2vw,72px);margin:0;line-height:1.2;word-break:keep-all;text-wrap:balance}
.bell-box #bellSub{margin:0;font-size:clamp(20px,2vw,32px);font-weight:500;font-variant-numeric:tabular-nums}
.bell-box{position:relative}
.bell-x{position:absolute;top:10px;right:12px;width:clamp(52px,4.4vw,68px);height:clamp(52px,4.4vw,68px);border-radius:50%;border:2.5px solid var(--ink);background:var(--white);font-size:clamp(30px,2.6vw,42px);line-height:1;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0 0 4px}
.bell-pin{width:min(360px,100%);display:flex;flex-direction:column;gap:10px}
.bell-pin p{margin:0}
.bell-pin .keys button{min-height:clamp(44px,5.4vh,62px)}

/* 체스 */
.ch-wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(240px,22vw,340px);gap:18px}
.ch-board{display:flex;align-items:center;justify-content:center;min-width:0;overflow:auto}
.cb{display:grid;grid-template-columns:repeat(8,var(--sq));grid-template-rows:repeat(8,var(--sq));border:3px solid var(--ink)}
.sq{position:relative;border:0;padding:0;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.sq.lt{background:var(--white)}.sq.dk{background:var(--lav)}
.sq.last{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--lemon) 75%,transparent)}
.sq.sel{box-shadow:inset 0 0 0 4px var(--ink)}
.sq.chk{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--rose) 90%,transparent),inset 0 0 0 4px var(--bad)}
.sq.to::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:color-mix(in srgb,var(--good) 70%,transparent)}
.sq.cap::after{content:"";position:absolute;inset:6%;border-radius:50%;border:4px solid color-mix(in srgb,var(--good) 75%,transparent)}
.sq:disabled{opacity:1;cursor:default}
.pc{font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif;line-height:1;font-size:calc(var(--sq,60px) * .78);position:relative;z-index:1}
.pc.b{color:var(--ink)}
.pc.w{color:var(--white);-webkit-text-stroke:1.6px var(--ink);paint-order:stroke fill}
.sq .rk-l,.sq .fl-l{position:absolute;font-style:normal;font-size:11px;color:var(--muted);font-family:var(--body)}
.sq .rk-l{left:3px;top:2px}.sq .fl-l{right:4px;bottom:1px}
.caps{display:flex;flex-direction:column;gap:4px;font-size:15px}
.caps div{display:flex;flex-wrap:wrap;gap:2px;min-height:30px}
.caps .pc{font-size:28px}
.howto{font-size:14px;color:var(--muted)}
.howto summary{cursor:pointer;font-weight:500}
.howto ul{margin:6px 0 0;padding-left:1.1em;line-height:1.6}
.howto b{color:var(--ink)}


/* 오델로 */
.ob{display:grid;grid-template-columns:repeat(8,var(--sq));grid-template-rows:repeat(8,var(--sq));gap:3px;background:var(--ink);border:3px solid var(--ink);border-radius:8px}
.oq{border:0;padding:0;background:var(--mint);display:flex;align-items:center;justify-content:center;position:relative;touch-action:manipulation}
.oq:disabled{opacity:1;cursor:default}
.oq.ok::after{content:"";width:22%;height:22%;border-radius:50%;background:color-mix(in srgb,var(--ink) 35%,transparent)}
.oq.pend{background:var(--lemon)}.oq.pend::after{display:none}
.oq.fl{background:var(--rose)}
.oq.last{box-shadow:inset 0 0 0 3px var(--bad)}
.os{width:82%;height:82%;border-radius:50%;border:2.5px solid var(--ink)}
.os.b{background:var(--ink)}.os.w{background:var(--white)}.os.ghost{opacity:.45}

/* 24 만들기 */
.t24-top{display:flex;gap:18px;flex-wrap:wrap}
.t24{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(240px,24vw,360px);gap:18px}
.t24-main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,3vh,34px);padding:20px;min-width:0}
.t24-cards{display:flex;gap:clamp(10px,1.6vw,24px);flex-wrap:wrap;justify-content:center}
.t24c{width:clamp(96px,10vw,170px);height:clamp(120px,15vh,200px);font-family:var(--num);font-size:clamp(36px,4.4vw,76px);font-weight:700;font-variant-numeric:tabular-nums}
.t24c.win::before{--fill:var(--good-bg);border-color:var(--good);border-width:5px}
.t24c:disabled{opacity:1}
.t24-ops{display:flex;gap:clamp(10px,1.2vw,18px)}
.t24o{width:clamp(64px,6vw,96px);height:clamp(64px,6vw,96px);font-size:clamp(30px,3vw,50px);font-weight:700}
.t24-say{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(22px,2.2vw,36px);text-align:center}
.t24-log{margin:0;padding-left:1.4em;font-family:var(--num);font-size:clamp(17px,1.4vw,24px);line-height:1.6}

/* 퀴즈 공통 */
.qz{flex:1;padding:clamp(20px,2.6vw,40px);display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2vh,22px);min-height:0}
.qz-p{margin:0;color:var(--muted);font-size:clamp(16px,1.3vw,22px)}
.qz-big{text-align:center;line-height:1.3}
.qz-e{font-family:var(--num);font-size:clamp(48px,5.4vw,96px);font-weight:700;letter-spacing:.02em}
.qz-k{font-family:var(--display);font-size:clamp(40px,4.4vw,78px);font-weight:700}
.qz-s{font-family:var(--display);font-size:clamp(28px,3vw,52px);font-weight:700}
.qz-s u{text-decoration:none;border-bottom:4px solid var(--ink);display:inline-block;min-width:3em}
.qz-opts{grid-template-columns:repeat(2,minmax(0,1fr));width:min(100%,980px)}
.qz .ctrl{justify-content:center;margin-top:0}
.qz .steps{width:min(100%,980px)}
.sp-ans{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sp-ans span{width:clamp(38px,3.4vw,58px);height:clamp(48px,4.4vw,72px);border-bottom:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:clamp(28px,3vw,48px);font-weight:700}
.sp-tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:980px}
.sp-tiles button{width:clamp(48px,4.2vw,72px);height:clamp(48px,4.2vw,72px);font-family:var(--num);font-size:clamp(24px,2.4vw,40px);font-weight:700}
.wta{width:100%;min-height:40vh;font-family:var(--body);font-size:16px;line-height:1.6;padding:10px 12px;border:1.5px solid var(--ink);border-radius:10px;background:var(--white);color:var(--ink);resize:vertical}

/* 31 게임 */
.g31{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(12px,1.8vh,24px)}
.track{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:clamp(4px,.6vw,10px)}
.nb{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:clamp(13px,1.6vw,28px);background:var(--white)}
.nb.p0{background:var(--peach);border-color:var(--ink)}
.nb.p1{background:var(--sky);border-color:var(--ink)}
.nb.new{border-width:4px;font-weight:700}
.nb.end{border-color:var(--bad);border-style:dashed;color:var(--bad);font-weight:700}
.nb.end.p0,.nb.end.p1{border-style:solid;background:var(--rose)}
.g31-mid{display:flex;align-items:center;justify-content:center;gap:16px 28px;flex-wrap:wrap}
.who-chip{padding:8px 20px;font-family:var(--display);font-weight:700;font-size:clamp(22px,2.2vw,36px)}
.status{font-family:var(--display);font-size:clamp(24px,2.6vw,46px);font-weight:700;text-align:center}
.say{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.say button{padding:clamp(14px,2.2vh,26px) 12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.say b{font-size:clamp(22px,2.2vw,36px)}
.say small{font-family:var(--num);font-size:clamp(16px,1.4vw,24px);color:var(--muted)}
.rec{text-align:center;color:var(--muted);font-size:clamp(14px,1.1vw,18px)}

@media (max-width:900px){
  .bb,.bb.duel,.om,.bq,.nn-wrap,.dt-wrap,.ch-wrap,.t24{grid-template-columns:1fr}
  .qz-opts{grid-template-columns:1fr}
  .track{grid-template-columns:repeat(8,minmax(0,1fr))}
  .say{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  </filter>
</svg>

<div class="app">

</div>
<div class="bell-banner" id="bellBanner" hidden role="status"><b id="bellBannerTxt">수업 시작 1분 전입니다</b><button class="btn sketch f-white" type="button" id="bellOk">확인</button></div>
<div class="bell" id="bell" hidden role="alertdialog" aria-modal="true"><div class="bell-box sketch f-lemon">
  <p class="bell-k">일시정지</p><h2 id="bellTitle">다음 시간 수업 준비!</h2><p id="bellSub"></p>
  <p class="note" id="bellNote">게임은 멈춰 있고, 제한 시간도 흐르지 않아요.</p>

<script>
const $=(s,r=document)=>r.querySelector(s);
const stage=$('#stage');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const store={
  get(k,d){try{const v=localStorage.getItem('break-arcade-'+k);return v==null?d:JSON.parse(v)}catch(_){return d}},
  set(k,v){try{localStorage.setItem('break-arcade-'+k,JSON.stringify(v))}catch(_){}}
};
const seg=(label,name,items,cur)=>`<div class="seg"><span class="lb">${label}</span>${items.map(([v,t])=>`<button class="sketch f-lemon" type="button" data-seg="${name}" data-v="${v}" aria-pressed="${String(v)===String(cur)}">${t}</button>`).join('')}</div>`;
function arm(btn,label,done){
  if(btn.classList.contains('armed')){clearTimeout(btn._t);done();return}
  btn.classList.add('armed');const old=btn.textContent;btn.textContent=label;
  btn._t=setTimeout(()=>{btn.classList.remove('armed');btn.textContent=old},3000);
}

/* ───────── 랭킹 · 제한 시간 (창을 닫으면 사라진다) ───────── */
const MEM={};
const sess={
  get(k,d){try{const v=localStorage.getItem('arcade-rk-'+k);return v==null?(k in MEM?MEM[k]:d):JSON.parse(v)}catch(_){return k in MEM?MEM[k]:d}},
  set(k,v){MEM[k]=v;try{localStorage.setItem('arcade-rk-'+k,JSON.stringify(v))}catch(_){}}
};
let pausedTotal=0,pauseAt=null;
const MIN=60000,now=()=>(pauseAt??Date.now())-pausedTotal;
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+'분 '+String(s%60).padStart(2,'0')+'초'};
const clockTxt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const RK={
  bb3:{game:'baseball',name:'3자리',rule:'시도 횟수가 적을수록 위, 같으면 빨리 맞힌 사람이 위예요. 제한 5분.',limit:5*MIN,key:r=>[r.tries,r.ms],show:r=>`${r.tries}회 · ${mmss(r.ms)}`},
  bb4:{game:'baseball',name:'4자리',rule:'시도 횟수가 적을수록 위, 같으면 빨리 맞힌 사람이 위예요. 제한 10분.',limit:10*MIN,key:r=>[r.tries,r.ms],show:r=>`${r.tries}회 · ${mmss(r.ms)}`},
  bq:{game:'brain',name:'랭킹 도전 10문제',rule:'10문제 중 맞힌 수가 많을수록 위예요. 같으면 힌트를 적게 쓴 사람, 그다음 빨리 끝낸 사람이 위예요. 제한 10분.',limit:10*MIN,key:r=>[-r.ok,r.hints,r.ms],show:r=>`${r.ok}/10 · 힌트 ${r.hints}회 · ${mmss(r.ms)}`},
  omok:{game:'omok',name:'승리 횟수',rule:'이긴 횟수가 많을수록 위예요.',win:true},
  dots:{game:'dots',name:'승리 횟수',rule:'이긴 횟수가 많을수록 위예요.',win:true},
  g31:{game:'g31',name:'어려움 컴퓨터 상대',rule:'어려움 컴퓨터를 이긴 횟수가 많을수록 위예요.',win:true},
};
function rkDefine(id,def){RK[id]=def}
function rkCmp(a,b){for(let i=0;i<a.length;i++){if(a[i]!==b[i])return a[i]-b[i]}return 0}
function rkList(k){return sess.get(k,[])}
function rkPlace(k,rec){const d=RK[k];if(d.win)return 0;const kk=d.key(rec);return rkList(k).filter(e=>rkCmp(d.key(e),kk)<=0).length}
function rkAdd(k,id,rec){
  const d=RK[k];let L=rkList(k);
  if(d.win){const e=L.find(x=>x.id===id);if(e)e.w++;else L.push({id,w:1});L.sort((a,b)=>b.w-a.w)}
  else{const old=L.find(x=>x.id===id);
    if(old&&rkCmp(d.key(old),d.key(rec))<=0){sess.set(k,L);return false}
    L=L.filter(x=>x.id!==id);L.push({id,...rec});L.sort((a,b)=>rkCmp(d.key(a),d.key(b)));L=L.slice(0,10)}
  sess.set(k,L);return true;
}
/* 제한 시간 표시: 현재 게임의 timer()가 {t0,t1,limit}를 돌려준다 */
const gtimeHTML=()=>`<span class="gtime" id="gtime"></span>`;
function gtimeTick(){
  const el=$('#gtime');if(!el)return;const g=GAMES.find(x=>x.id===curTab).g,t=g.timer&&g.timer();
  if(!t){el.textContent='';el.hidden=true;return}el.hidden=false;
  const over=t.t0&&((t.t1||now())-t.t0)>t.limit;el.classList.toggle('over',!!over);
  if(!t.t0)el.textContent=`제한 ${clockTxt(t.limit)} · 첫 입력부터 재요`;
  else if(t.t1)el.textContent=`기록 ${mmss(t.t1-t.t0)}${over?' · 제한 시간 초과':''}`;
  else el.textContent=over?'제한 시간 초과 · 랭킹 제외':`남은 시간 ${clockTxt(t.limit-(now()-t.t0))}`;
}
setInterval(gtimeTick,250);
const within=(t0,t1,limit)=>t0&&t1&&(t1-t0)<=limit;

ov.addEventListener('click',e=>{
  if(e.target===ov){ovClose();return}
  const t=e.target.closest('button');if(!t||t.disabled||!ovState)return;const s=ovState;
  if(t.dataset.ov==='close'){ovClose();return}
  if(t.dataset.ov==='board'){rkBoard(RK[s.k].game,s.k);return}
  if(t.dataset.ov==='clear'){ovState={mode:'clear',k:s.k,game:s.game,pin:'',warn:''};ovRender();return}
  if(t.dataset.ck){const v=t.dataset.ck;if(v==='back'){rkBoard(s.game,s.k);return}if(v==='del')s.pin=s.pin.slice(0,-1);else if(s.pin.length<4)s.pin+=v;s.warn='';
    if(s.pin.length===4){if(pinHash(s.pin)===PIN_H){sess.set(s.k,[]);rkBoard(s.game,s.k);return}s.pin='';s.warn='비밀번호가 맞지 않아요.'}ovRender();return}
  if(t.dataset.ovt){s.k=t.dataset.ovt;s.hi=null;ovRender();return}
  if(t.dataset.wk){const v=t.dataset.wk;if(v==='del')s.pin=s.pin.slice(0,-1);else if(s.pin.length<4)s.pin+=v;s.warn='';
    if(s.pin.length===4){if(pinHash(s.pin)===PIN_H){s.ok=true}else{s.pin='';s.warn='비밀번호가 맞지 않아요.'}}ovRender();return}
  if(t.dataset.ov==='wsave'){const p=parseWords($('#wordsTa').value);
    if(p.length<8){s.warn=`쓸 수 있는 단어가 ${p.length}개뿐이에요. ‘단어,뜻’ 형식으로 8개 이상 써 주세요.`;const keep=$('#wordsTa').value;ovRender();$('#wordsTa').value=keep;return}
    WORDS=p;wordsCustom=true;try{localStorage.setItem('break-arcade-words',p.map(x=>x.join(',')).join('\n'))}catch(_){}
    ovClose();if(curTab==='word')WORDQ.rerender();return}
  if(t.dataset.ov==='wreset'){arm(t,'한 번 더 누르면 되돌린다',()=>{WORDS=parseWords(WORDS_DEFAULT);wordsCustom=false;try{localStorage.removeItem('break-arcade-words')}catch(_){}ovRender()});return}
  if(t.dataset.ovg){rkBoard(t.dataset.ovg);return}
  if(t.dataset.ovk)ovInput(t.dataset.ovk);
});
/* 학번: 학년(1~3) + 반(1~6) + 번호(01~40) 네 자리만 받는다 */
const isHakbun=id=>/^[1-3][1-6](0[1-9]|[1-3][0-9]|40)$/.test(id);
const WARN='학번만 쓸 수 있어요.';
function ovInput(v){
  const s=ovState;if(!s||s.mode!=='entry')return;
  if(v==='del'){s.id=s.id.slice(0,-1);s.warn=''}
  else if(v==='ok'){
    if(s.id.length<4)s.warn='학번 4자리를 모두 입력해 주세요.';
    else if(!isHakbun(s.id))s.warn=WARN+' (예: 1503)';
    else{const k=s.k,id=s.id;rkAdd(k,id,s.rec);rkBoard(RK[k].game,k);ovState.hi=id;ovRender();return}
  }
  else if(/^\d$/.test(v)){if(s.id.length<4){s.id+=v;s.warn=''}else s.warn='학번은 4자리예요.'}
  else s.warn=WARN;
  ovRender();
}
function ovKey(e){
  if(e.key==='Escape'){ovClose();return}
  if(!ovState||ovState.mode!=='entry')return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^\d$/.test(e.key))ovInput(e.key);
  else if(e.key==='Backspace')ovInput('del');
  else if(e.key==='Enter')ovInput('ok');
  else if(e.key.length===1||e.key==='Process'||e.isComposing)ovInput('bad');
  else return;
  e.preventDefault();
}

/* ───────── 수업 알림 · 일시정지 (소리 없음) ───────── */
/* 강릉제일고 교시 시각. 수요일은 6교시까지 */
const BELL=[['08:40','09:30'],['09:40','10:30'],['10:40','11:30'],['11:40','12:30'],['13:30','14:20'],['14:30','15:20'],['15:40','16:30']];
const hm=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
function todayPeriods(d){const w=d.getDay();if(w<1||w>5)return[];return (w===3?BELL.slice(0,6):BELL).map(([s,e],i)=>({no:i+1,s:hm(s)*60,e:hm(e)*60,sTxt:s}))}
let bellUnlock=null,bellBannerOff=null,bellMode='',bellPreOff=null,bellPinOn=false,bellPinVal='',bellPinMsg='';
const bellEl=$('#bell'),bannerEl=$('#bellBanner');
function bellState(){
  const d=new Date(),t=d.getHours()*3600+d.getMinutes()*60+d.getSeconds(),P=todayPeriods(d);
  for(const p of P){
    if(t>=p.s-30&&t<p.e)return{mode:'lock',p,left:p.s-t};
    if(t>=p.s-60&&t<p.s-30)return{mode:'banner',p,left:p.s-t};
  }
  const next=P.find(p=>p.s-60>t);return{mode:'',next,none:!P.length};
}
function bellTick(){
  const s=bellState();
  const nx=$('#nextClass');
  if(nx){const n=s.mode?s.p:s.next;nx.textContent=n?`${s.mode==='lock'&&s.left<=0?'지금':'다음'} 수업 ${n.no}교시 ${n.sTxt}`:s.none?'오늘은 수업이 없어요.':'오늘 수업은 모두 끝났어요.'}
  /* 1분 전 알림 */
  const showBanner=s.mode==='banner'&&bellBannerOff!==s.p.no;
  bannerEl.hidden=!showBanner;
  if(showBanner)$('#bellBannerTxt').textContent=`수업 시작 1분 전입니다 · ${s.p.no}교시 ${s.p.sTxt}`;
  /* 30초 전부터 수업 끝까지 일시정지 */
  const lock=s.mode==='lock'&&bellUnlock!==s.p.no&&!(s.left>0&&bellPreOff===s.p.no);
  if(lock&&bellMode!=='lock'){gamePause(true)}
  if(!lock&&bellMode==='lock'){gamePause(false)}
  bellMode=lock?'lock':'';
  bellEl.hidden=!lock;
  if(lock){
    $('#bellTitle').textContent=s.left>0?'다음 시간 수업 준비!':`${s.p.no}교시 수업 중이에요`;
    $('#bellSub').textContent=s.left>0?`${s.p.no}교시 ${s.p.sTxt} 시작 · ${s.left}초 남았어요`:'쉬는 시간이 되면 다시 열려요.';
    if(s.left>0&&bellPinOn){bellPinOn=false}
    $('#bellNote').textContent=s.left>0?'게임은 멈춰 있고, 제한 시간도 흐르지 않아요. 오른쪽 위 ×를 누르면 닫혀요.':'수업 시간에는 선생님 비밀번호를 입력해야 닫혀요.';
    bellPinRender();
  }else if(bellPinOn){bellPinOn=false;bellPinRender()}
  if(s.mode===''){bellUnlock=null;bellBannerOff=null;bellPreOff=null}
}
/* 게임 시계: 일시정지 동안 멈춘다. 모든 제한 시간이 이 시계를 쓴다 */
function gamePause(on){
  if(on&&pauseAt==null){pauseAt=Date.now();if(!ov.hidden)ovClose()}
  if(!on&&pauseAt!=null){pausedTotal+=Date.now()-pauseAt;pauseAt=null}
}
$('#bellOk').addEventListener('click',()=>{const s=bellState();if(s.mode==='banner')bellBannerOff=s.p.no;bannerEl.hidden=true});
/* 닫기: 수업 직전(30초 전~시작)은 누구나, 수업 중에는 선생님 비밀번호 */
const PIN_H='41nu';/* 비밀번호를 그대로 적지 않고 변환한 값 */
const pinHash=s=>{let x=7;for(const c of s)x=(x*131+c.charCodeAt(0)*17+11)%1000003;return x.toString(36)};
function bellPinRender(){
  const el=$('#bellPin');el.hidden=!bellPinOn;if(!bellPinOn)return;
  el.innerHTML=`<p><b>선생님 비밀번호</b></p>
    <div class="slots">${[0,1,2,3].map(i=>`<span class="slot">${bellPinVal[i]?'●':''}</span>`).join('')}</div>
    ${bellPinMsg?`<p class="ovwarn">${bellPinMsg}</p>`:''}
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" class="sketch f-white" data-pin="${n}">${n}</button>`).join('')}
      <button type="button" class="sketch f-paper fn" data-pin="cancel">취소</button><button type="button" class="sketch f-white" data-pin="0">0</button>
      <button type="button" class="sketch f-paper fn" data-pin="del">지우기</button></div>`;
}
$('#bellX').addEventListener('click',()=>{
  const s=bellState();if(s.mode!=='lock')return;
  if(s.left>0){bellPreOff=s.p.no;bellTick();return}
  bellPinOn=true;bellPinVal='';bellPinMsg='';bellPinRender();
});
$('#bellPin').addEventListener('click',e=>{
  const t=e.target.closest('[data-pin]');if(!t)return;const v=t.dataset.pin;
  if(v==='cancel'){bellPinOn=false;bellPinRender();return}
  if(v==='del'){bellPinVal=bellPinVal.slice(0,-1);bellPinMsg=''}
  else if(bellPinVal.length<4){bellPinVal+=v;bellPinMsg=''}
  if(bellPinVal.length===4){
    if(pinHash(bellPinVal)===PIN_H){const s=bellState();if(s.mode==='lock')bellUnlock=s.p.no;bellPinOn=false;bellPinVal='';bellTick();return}
    bellPinVal='';bellPinMsg='비밀번호가 맞지 않아요.';
  }
  bellPinRender();
});
setInterval(bellTick,1000);

/* ───────── 1. 숫자야구 ───────── */
const BBset={digits:3,mode:'solo'};let bb=null;
const secret=n=>shuffle([...'0123456789']).slice(0,n).join('');
function judgeBB(sec,g){let s=0,b=0;for(let i=0;i<g.length;i++){if(sec[i]===g[i])s++;else if(sec.includes(g[i]))b++}return{s,b}}
function bbNew(){bb={digits:BBset.digits,mode:BBset.mode,turn:0,entry:'',over:false,result:'',msg:'',t0:null,t1:null,
  teams:(BBset.mode==='duel'?[0,1]:[0]).map(()=>({secret:secret(BBset.digits),hist:[],memo:Array(10).fill(0),solved:false}))}}
function chips(h,n){if(h.s===n)return `<em class="c win">${n}S 정답</em>`;
  if(!h.s&&!h.b)return `<em class="c out">아웃</em>`;
  return (h.s?`<em class="c s">${h.s}S</em>`:'')+(h.b?`<em class="c b">${h.b}B</em>`:'')}
function bbTeam(k){
  const T=bb.teams[k],duel=bb.mode==='duel',cur=duel&&bb.turn===k&&!bb.over;
  return `<section class="bb-team sketch ${duel?(k?'f-sky':'f-peach'):'f-white'}${cur?' cur':''}">
    <div class="tt"><b>${duel?(k?'B팀':'A팀'):'시도 기록'}</b><span>${T.hist.length}회</span>${T.solved?'<span class="ok">정답</span>':''}${cur?'<span class="ok">차례</span>':''}</div>
    <div class="memo">${T.memo.map((m,d)=>`<button type="button" data-memo="${k}|${d}" class="${m===1?'x':m===2?'o':''}" aria-label="숫자 ${d} 메모">${d}</button>`).join('')}</div>
    <div class="memo-h">숫자 메모: 한 번 누르면 없는 숫자(줄), 두 번 누르면 있는 숫자(초록)</div>
    <ol class="hist">${T.hist.length?T.hist.map((h,i)=>`<li><span class="hn">${i+1}</span><span class="hg">${h.g}</span><span class="hr">${chips(h,bb.digits)}</span></li>`).reverse().join(''):'<li class="empty">아직 시도가 없다.</li>'}</ol>
    ${bb.over&&!T.solved?`<div class="bbans">정답 ${T.secret}</div>`:''}
  </section>`;
}
function bbPad(){
  const duel=bb.mode==='duel';
  if(bb.over){
    return `<section class="bb-pad"><div class="result sketch f-lemon"><b>${bb.result}</b>${bb.sub?`<span>${bb.sub}</span>`:''}
      <button class="btn big sketch f-mint" type="button" data-act="bbnew">새 게임</button></div></section>`;
  }

function renderBB(){
  stage.innerHTML=`<div class="ghead"><h2>숫자야구</h2><p>컴퓨터가 정한 서로 다른 숫자를 맞히자. 숫자와 자리가 맞으면 스트라이크(S), 숫자만 맞으면 볼(B), 하나도 없으면 아웃이다.</p></div>
   <div class="opts">${seg('자릿수','bbd',[[3,'3자리'],[4,'4자리']],BBset.digits)}${seg('방식','bbm',[['solo','혼자 도전'],['duel','2팀 대결']],BBset.mode)}
     <button class="btn sketch f-paper ghost" type="button" data-act="bbnew">새 게임</button>
     ${bb.mode==='solo'&&!bb.over?`<button class="btn sketch f-paper ghost" type="button" data-act="bbgive">포기하고 정답 보기</button>`:''}
     ${bb.mode==='solo'?gtimeHTML()+'<button class="btn sketch f-lav" type="button" data-act="rank">랭킹 보기</button>':'<span class="note">A팀부터 번갈아 입력한다. 두 팀은 서로 다른 숫자를 맞힌다. 2팀 대결은 랭킹에 오르지 않아요.</span>'}</div>
   <div class="bb ${bb.mode}">${bb.mode==='duel'?bbTeam(0)+bbPad()+bbTeam(1):bbPad()+bbTeam(0)}</div>`;

function bbSubmit(){
  if(bb.over||bb.entry.length<bb.digits)return;
  const k=bb.mode==='duel'?bb.turn:0,T=bb.teams[k],g=bb.entry,r=judgeBB(T.secret,g);
  T.hist.push({g,...r});bb.entry='';bb.msg='';
  if(r.s===bb.digits)T.solved=true;
  if(bb.mode==='solo'){
    if(T.solved){bb.over=true;bb.t1=now();const n=T.hist.length,k='bb'+bb.digits;
      bb.result=`정답! ${n}번 만에 맞혔다.`;bb.sub=within(bb.t0,bb.t1,RK[k].limit)?`걸린 시간 ${mmss(bb.t1-bb.t0)}`:'제한 시간을 넘겨 랭킹에는 오르지 않아요.';
      renderBB();if(within(bb.t0,bb.t1,RK[k].limit))rkEntry(k,{tries:n,ms:bb.t1-bb.t0},`정답! ${n}번 만에 맞혔다.`);return}
  }else{
    const A=bb.teams[0],B=bb.teams[1];
    if(k===0){bb.turn=1;if(A.solved)bb.msg='A팀 정답. B팀이 이번에 맞히면 무승부이다.'}
    else{
      if(A.solved){bb.over=true;bb.result=B.solved?'무승부':'A팀 승리';bb.sub=`${A.hist.length}번째 시도에서 결정되었다.`}
      else if(B.solved){bb.over=true;bb.result='B팀 승리';bb.sub=`${B.hist.length}번 만에 맞혔다.`}
      else bb.turn=0;
    }
  }
  renderBB();
}
const BASEBALL={
  mount(){if(!bb||bb.digits!==BBset.digits||bb.mode!==BBset.mode)bbNew();renderBB();gtimeTick()},
  timer(){return bb&&bb.mode==='solo'?{t0:bb.t0,t1:bb.t1,limit:RK['bb'+bb.digits].limit}:null},
  click(t){
    if(t.dataset.seg==='bbd'){BBset.digits=+t.dataset.v;bbNew();renderBB();return}
    if(t.dataset.seg==='bbm'){BBset.mode=t.dataset.v;bbNew();renderBB();return}
    if(t.dataset.act==='bbnew'){bbNew();renderBB();return}
    if(t.dataset.act==='bbgive'){bb.over=true;bb.t0=null;bb.result=`정답은 ${bb.teams[0].secret}이다.`;bb.sub='';renderBB();return}
    if(t.dataset.memo){const[k,d]=t.dataset.memo.split('|').map(Number);const m=bb.teams[k].memo;m[d]=(m[d]+1)%3;renderBB();return}
    if(t.dataset.key){const v=t.dataset.key;
      if(v==='del')bb.entry=bb.entry.slice(0,-1);
      else if(v==='ok'){bbSubmit();return}
      else if(bb.entry.length<bb.digits&&!bb.entry.includes(v)){bb.entry+=v;if(!bb.t0&&bb.mode==='solo')bb.t0=now()}
      renderBB();}
  },
  key(e){if(!bb||bb.over)return;
    if(/^[0-9]$/.test(e.key)&&bb.entry.length<bb.digits&&!bb.entry.includes(e.key)){bb.entry+=e.key;if(!bb.t0&&bb.mode==='solo')bb.t0=now();renderBB()}
    else if(e.key==='Backspace'){bb.entry=bb.entry.slice(0,-1);renderBB()}
    else if(e.key==='Enter')bbSubmit();}
};

const N=15;const OM={b:null,moves:[],turn:1,over:false,win:null,score:{1:0,2:0},preview:null,msg:''};
function omNew(){OM.b=Array.from({length:N},()=>Array(N).fill(0));OM.moves=[];OM.turn=1;OM.over=false;OM.win=null;OM.preview=null;OM.msg=''}
let omRO=null,omSize=0;
function omWin(x,y,c){
  for(const[dx,dy]of[[1,0],[0,1],[1,1],[1,-1]]){
    const line=[[x,y]];
    for(const s of[1,-1]){let i=x+dx*s,j=y+dy*s;while(i>=0&&i<N&&j>=0&&j<N&&OM.b[j][i]===c){line.push([i,j]);i+=dx*s;j+=dy*s}}
    if(line.length>=5)return line;
  }return null;
}
function omDraw(){
  const cv=$('#omCv');if(!cv)return;const dpr=window.devicePixelRatio||1,s=omSize;
  cv.width=s*dpr;cv.height=s*dpr;cv.style.width=s+'px';cv.style.height=s+'px';
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,s,s);
  const cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue('--ink').trim(),white=cs.getPropertyValue('--white').trim(),
    bad=cs.getPropertyValue('--bad').trim(),good=cs.getPropertyValue('--good').trim();
  const cell=s/(N+1),P=i=>(i+1)*cell;
  ctx.strokeStyle=ink;ctx.globalAlpha=.55;ctx.lineWidth=1.2;
  for(let i=0;i<N;i++){ctx.beginPath();ctx.moveTo(P(0),P(i));ctx.lineTo(P(N-1),P(i));ctx.stroke();ctx.beginPath();ctx.moveTo(P(i),P(0));ctx.lineTo(P(i),P(N-1));ctx.stroke()}
  ctx.globalAlpha=1;ctx.fillStyle=ink;
  for(const[i,j]of[[3,3],[3,11],[7,7],[11,3],[11,11]]){ctx.beginPath();ctx.arc(P(i),P(j),cell*.09,0,7);ctx.fill()}
  const stone=(i,j,c,a)=>{ctx.globalAlpha=a;ctx.beginPath();ctx.arc(P(i),P(j),cell*.43,0,7);ctx.fillStyle=c===1?ink:white;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=ink;ctx.stroke();ctx.globalAlpha=1};
  for(let j=0;j<N;j++)for(let i=0;i<N;i++)if(OM.b[j][i])stone(i,j,OM.b[j][i],1);
  if(OM.preview&&!OM.over)stone(OM.preview[0],OM.preview[1],OM.turn,.4);
  const last=OM.moves[OM.moves.length-1];
  if(last){ctx.fillStyle=bad;ctx.beginPath();ctx.arc(P(last[0]),P(last[1]),cell*.13,0,7);ctx.fill()}
  if(OM.win){ctx.strokeStyle=good;ctx.lineWidth=4;for(const[i,j]of OM.win){ctx.beginPath();ctx.arc(P(i),P(j),cell*.47,0,7);ctx.stroke()}}
}
function omSide(){
  const name=c=>c===1?'흑':'백',st=c=>`<span class="stone ${c===1?'b':'w'}"></span>`;
  return `<h3>${OM.over?'경기 끝':'지금 차례'}</h3>
   <div class="big-turn">${OM.over?(OM.win?st(OM.turn)+name(OM.turn)+' 승리':'무승부'):st(OM.turn)+name(OM.turn)}</div>
   <p class="note">${OM.over?'':'두고 싶은 자리를 누르면 흐린 돌이 보인다. 같은 자리를 한 번 더 누르면 돌이 놓인다.'}</p>
   <div class="tally"><span>${st(1)}흑 승리</span><b>${OM.score[1]}</b><span>${st(2)}백 승리</span><b>${OM.score[2]}</b></div>
   <p class="note">${OM.msg}</p>
   <div class="btns">
     <button class="btn sketch f-paper" type="button" data-act="omundo" ${!OM.moves.length||OM.over?'disabled':''}>한 수 무르기</button>
     <button class="btn sketch f-lav" type="button" data-act="rank">랭킹 보기</button>
     <button class="btn sketch f-mint" type="button" data-act="omnew">새 판</button>
   </div>`;
}
function omRenderSide(){const s=$('#omSide');if(s)s.innerHTML=omSide()}
function omFit(){const box=$('#omBox');if(!box)return;omSize=Math.max(200,Math.floor(Math.min(box.clientWidth,box.clientHeight)-20));omDraw()}
function omTap(e){
  if(OM.over)return;const cv=e.currentTarget,r=cv.getBoundingClientRect(),cell=omSize/(N+1);
  const x=(e.clientX-r.left)/cell-1,y=(e.clientY-r.top)/cell-1,i=Math.round(x),j=Math.round(y);
  if(i<0||j<0||i>=N||j>=N||Math.hypot(x-i,y-j)>.48||OM.b[j][i])return;
  if(OM.preview&&OM.preview[0]===i&&OM.preview[1]===j){
    OM.b[j][i]=OM.turn;OM.moves.push([i,j]);OM.preview=null;OM.msg='';
    const w=omWin(i,j,OM.turn);
    if(w){OM.over=true;OM.win=w;OM.score[OM.turn]++;setTimeout(()=>rkEntry('omok',null,`${OM.turn===1?'흑':'백'} 승리!`),400)}
    else if(OM.moves.length===N*N){OM.over=true}
    else OM.turn=3-OM.turn;
    omRenderSide();
  }else OM.preview=[i,j];
  omDraw();
}

    $('#omCv').addEventListener('pointerdown',omTap);

  },
  unmount(){if(omRO){omRO.disconnect();omRO=null}},

  }
};

function lfresh(){return {cells:{},sel:null,check:false,checks:0,used:{},done:false,showAns:false,seen:false,added:{},armed:false,t0:null,t1:null}}
const LG_LIMIT={'연습':5*MIN,'기본':10*MIN,'도전':20*MIN};
LOGIC.forEach(P=>rkDefine('logic-'+P.id,{game:'logic',name:P.name,rule:`빨리 완성할수록 위예요. 조건 검사 1회마다 30초를 더해요. 제한 ${clockTxt(LG_LIMIT[P.level])}.`,limit:LG_LIMIT[P.level],key:r=>[r.ms+r.checks*30000],show:r=>mmss(r.ms+r.checks*30000)+(r.checks?` (검사 ${r.checks}회 포함)`:'')}));

const LEVEL_PTS={'연습':1,'기본':2,'도전':3};
const COLOR_FILL={'파란색':'f-sky','노란색':'f-lemon','빨간색':'f-rose','흰색':'f-white'};

function lcell(st,a,i){const v=st.cells[a+'|'+i];return v==null?null:v}
function lpos(P,st,a,v){for(let i=0;i<P.cols.length;i++)if(st.cells[a+'|'+i]===v)return i;return null}
/* 현재 표에서 조건의 참·거짓 판정. 아직 정할 수 없으면 null */
function lcond(P,st,c){
  const n=P.cols.length;
  if(c.k==='at'){const cv=lcell(st,c.a,c.i);if(cv!=null)return cv===c.v;return lpos(P,st,c.a,c.v)!=null?false:null}
  if(c.k==='same'){
    const i=lpos(P,st,c.a,c.v),j=lpos(P,st,c.b,c.w);
    if(i!=null&&j!=null)return i===j;
    if(i!=null&&lcell(st,c.b,i)!=null)return false;
    if(j!=null&&lcell(st,c.a,j)!=null)return false;
    return null;
  }
  if(c.k==='next'){
    const i=lpos(P,st,c.a,c.v);if(i==null)return null;
    const nb=[i-1,i+1].filter(j=>j>=0&&j<n);
    if(nb.some(j=>lcell(st,c.b,j)===c.w))return true;
    if(nb.every(j=>lcell(st,c.b,j)!=null))return false;
    const q=lpos(P,st,c.b,c.w);if(q!=null&&Math.abs(q-i)!==1)return false;
    return null;
  }
  if(c.k==='not'){
    const i=lpos(P,st,c.a,c.v),j=lpos(P,st,c.b,c.w);
    if(i!=null&&j!=null)return i!==j;
    if(i!=null&&lcell(st,c.b,i)!=null)return true;
    if(j!=null&&lcell(st,c.a,j)!=null)return true;
    return null;
  }
  if(c.k==='plus'){
    const i=lpos(P,st,c.a,c.v),j=lpos(P,st,c.b,c.w),d=c.d;
    if(i!=null&&j!=null)return j===i+d;
    if(i!=null){const t=i+d;if(t<0||t>=n)return false;const cv=lcell(st,c.b,t);return cv==null?null:cv===c.w}
    if(j!=null){const t=j-d;if(t<0||t>=n)return false;const cv=lcell(st,c.a,t);return cv==null?null:cv===c.v}
    return null;
  }
  return null;
}
function lgrade(P,st){
  let ok=0,no=0,empty=0;
  P.rows.forEach(r=>P.cols.forEach((_,i)=>{const v=lcell(st,r.a,i);if(v==null)empty++;else if(v===P.sol[r.a][i])ok++;else no++}));
  return {ok,no,empty,total:P.rows.length*P.cols.length};
}

function lgridHtml(P,st,mode){
  return `<div class="rwrap"><table class="lgrid"><thead><tr><th></th>${P.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>
  ${P.rows.map((r,ri)=>`<tr><th>${r.label}</th>${P.cols.map((_,i)=>{
    const v=lcell(st,r.a,i);
    if(mode==='answer'){
      const s=P.sol[r.a][i],wrong=v!=null&&v!==s;
      return `<td><div class="lcell sketch ${r.a==='색'?COLOR_FILL[s]:'f-paper'} ${wrong?'lwrong':v==null?'lempty':''}"><span>${s}</span>${wrong?`<s>${v}</s>`:v==null?'<s>빈칸</s>':''}</div></td>`;
    }
    const isSel=st.sel&&st.sel.a===r.a&&st.sel.i===i;
    const fill=v&&r.a==='색'?COLOR_FILL[v]:'f-paper';
    return `<td><button type="button" class="lcell sketch ${fill}${isSel?' lsel':''}${v?'':' lnone'}" data-lcell="${ri}|${i}" aria-label="${P.cols[i]} ${r.label}${v?' '+v:' 빈칸'}">${v||'·'}</button></td>`;
  }).join('')}</tr>`).join('')}
  </tbody></table></div>`;
}

function logicResults(P,st){

function logicClick(t){
  const L=S.logic,P=LOGIC[L.p],st=L.ps[L.p];
  if(t.dataset.lp!=null){L.p=+t.dataset.lp;render();return}
  if(t.dataset.lcell!=null){const [ri,i]=t.dataset.lcell.split('|').map(Number);const a=P.rows[ri].a;
    st.sel=(st.sel&&st.sel.a===a&&st.sel.i===i)?null:{a,i};}
  else if(t.dataset.lval!=null){
    if(!st.sel)return;const v=t.dataset.lval,a=st.sel.a;
    if(v===''){delete st.cells[a+'|'+st.sel.i]}
    else{const at=lpos(P,st,a,v);if(at!=null)delete st.cells[a+'|'+at];st.cells[a+'|'+st.sel.i]=v;if(!st.t0)st.t0=now()}
    /* 다음 빈칸으로 자동 이동하지 않는다 — 학생이 고른 칸을 직접 확인하게 둔다 */
    st.sel=null;
  }
  else if(t.dataset.lc!=null){const k=+t.dataset.lc;st.used[k]=!st.used[k]}
  else{
    const a=t.dataset.act;
    if(a!=='lclear'&&a!=='lrestart')st.armed=false;
    if(a==='lcheck'){st.check=!st.check;if(st.check)st.checks++}
    else if(a==='lresult'){st.done=true;st.sel=null;const gr=lgrade(P,st);
      if(gr.ok===gr.total&&!st.seen&&!st.t1&&st.t0){st.t1=now();render();
        if(within(st.t0,st.t1,LG_LIMIT[P.level]))rkEntry('logic-'+P.id,{ms:st.t1-st.t0,checks:st.checks},`${P.name} 완성!`);return}}
    else if(a==='lback')st.done=false;
    else if(a==='lanswers'){st.showAns=!st.showAns;if(st.showAns)st.seen=true}
    else if(a==='lclear'||a==='lrestart'){
      if(!st.armed){st.armed=true;clearTimeout(st.armT);st.armT=setTimeout(()=>{st.armed=false;render()},3000)}
      else{clearTimeout(st.armT);L.ps[L.p]=lfresh()}
    }
  }
  render();
}

/* 성냥개비 그리기 */
const SEG7={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg'};
function matchSVG(eq){
  const W=64,H=112,gap=20;let x=10,out='';
  const stick=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#D9A441" stroke-width="7" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="6" fill="#C4553F"/>`;
  for(const ch of eq){
    if(SEG7[ch]){const s=SEG7[ch],L=x+6,R=x+W-6,T=8,M=H/2,B=H-8;
      const P={a:[L+6,T,R-6,T],b:[R,T+6,R,M-6],c:[R,M+6,R,B-6],d:[L+6,B,R-6,B],e:[L,M+6,L,B-6],f:[L,T+6,L,M-6],g:[L+6,M,R-6,M]};
      for(const k of s)out+=stick(...P[k]);x+=W+gap;}
    else{const cx=x+22,cy=H/2;
      if(ch==='+'){out+=stick(cx-20,cy,cx+20,cy)+stick(cx,cy-20,cx,cy+20)}
      if(ch==='-'){out+=stick(cx-20,cy,cx+20,cy)}
      if(ch==='='){out+=stick(cx-20,cy-12,cx+20,cy-12)+stick(cx-20,cy+12,cx+20,cy+12)}
      x+=44+gap;}
  }
  return `<svg class="mt" viewBox="0 0 ${x} ${H+4}" role="img" aria-label="성냥개비 식 ${eq}">${out}</svg>`;
}
function bqShow(p,solved){
  const s=p.show;
  if(s.seq)return `<div class="bq-seq">${s.seq.map(v=>`<span class="${v==='?'?'qm':''}">${v}</span>`).join('<i>,</i>')}</div>`;
  if(s.lines)return `<div class="bq-lines">${s.lines.map(v=>`<span class="${v==='?'?'qm':''}">${v}</span>`).join('')}</div>`;
  if(s.pairs)return `<div class="bq-pairs">${s.pairs.map(([l,r])=>`<span>${l}</span><span>=</span><span class="${r==='?'?'qm':''}">${r}</span>`).join('')}</div>`;
  if(s.match)return `<div class="bq-match">${matchSVG(s.match)}${solved&&p.solve?`<div class="mt-sol"><span>정답</span>${matchSVG(p.solve)}</div>`:''}</div>`;
  if(s.grid)return `<div class="bq-grid">${s.grid.map(v=>`<span class="${v==='?'?'qm':''}">${v}</span>`).join('')}</div>`;
  if(s.tiles)return `<div class="bq-tiles">${s.tiles.map(v=>`<span class="sketch f-lemon">${v}</span>`).join('')}</div>`;
  if(s.dice)return `<div class="bq-dice"><span>5</span><span></span><span></span></div>`;
  if(s.text)return `<p class="bq-text">${s.text}</p>`;
  return '';
}
let bq={i:0,sel:null,state:{},hint:{}};
function bqSolvedSet(){return new Set(sess.get('bq-solved',[]))}
function renderBQ(){
  const p=BQ[bq.i],st=bq.state[bq.i]||'',solved=bqSolvedSet(),showW=st==='ok'||st==='give';

  let body;
  if(p.open){

       <button class="btn big sketch f-mint reveal" type="button" data-act="bqcheck" ${bq.sel==null?'disabled':''}>정답 확인</button>`}</div>`;

  stage.innerHTML=`<div class="ghead"><h2>두뇌 퀴즈</h2><p>규칙 찾기, 숨은 규칙, 발상 전환, 공간, 논리까지 여러 방향으로 생각해야 풀리는 문제이다. 자유 풀이는 시간 제한이 없다.</p></div>
    <div class="opts">${seg('방식','bqm',[['free','자유 풀이'],['rank','랭킹 도전 (10문제)']],BQmode)}<button class="btn sketch f-lav" type="button" data-act="rank">랭킹 보기</button></div>
    <div class="bq-top"><div class="bq-dots">${dots}</div><span class="note">이 칠판에서 맞힌 문제 ${solved.size} / ${BQ.length}</span></div>
    <div class="bq">
      <div class="bq-card sketch f-white">
        <div class="bq-cat"><span class="sketch f-lav">${p.cat}</span><b>${bq.i+1}.</b></div>

        ${bqShow(p,showW)}
        ${bq.hint[bq.i]?`<p class="bq-hint">힌트 · ${p.hint}</p>`:''}
      </div>
      <div class="bq-side">
        ${body}${fb}
        ${showW?`<div class="steps sketch f-lemon"><b>${p.open?'정답 · '+p.open:'해설'}</b>${p.w?`<p>${p.w}</p>`:''}${p.open&&!solved.has(bq.i)?`<p><button class="btn sketch f-mint" type="button" data-act="bqself">맞혔다면 누르자</button></p>`:''}</div>`:''}
        <div class="bq-nav">
          <button class="btn sketch f-paper" type="button" data-act="bqprev" ${bq.i===0?'disabled':''}>이전 문제</button>
          <button class="btn sketch f-lemon" type="button" data-act="bqnext" ${bq.i===BQ.length-1?'disabled':''}>다음 문제</button>
        </div>
        <button class="btn sketch f-paper ghost bq-reset" type="button" data-act="bqreset">맞힌 기록 지우기</button>
      </div>
    </div>`;
}
function bqGo(i){bq.i=i;bq.sel=null;if(bq.state[i]==='no')bq.state[i]='';renderBQ()}
const BRAINQ={
  mount(){if(!bqr)bqrNew();BQmode==='rank'?renderBQR():renderBQ()},
  timer(){return BQmode==='rank'&&bqr&&bqr.phase!=='ready'?{t0:bqr.t0,t1:bqr.t1,limit:RK.bq.limit}:BQmode==='rank'?{t0:null,t1:null,limit:RK.bq.limit}:null},
  click(t){
    if(t.dataset.seg==='bqm'){BQmode=t.dataset.v;if(!bqr)bqr=null;if(BQmode==='rank'&&(!bqr||bqr.phase==='end'))bqrNew();BQmode==='rank'?renderBQR():renderBQ();return}
    if(BQmode==='rank'){bqrClick(t);return}
    if(t.dataset.bq!=null){bqGo(+t.dataset.bq);return}
    if(t.dataset.bqo!=null){bq.sel=+t.dataset.bqo;if(bq.state[bq.i]==='no')bq.state[bq.i]='';renderBQ();return}
    const a=t.dataset.act,p=BQ[bq.i];
    if(a==='bqhint'){bq.hint[bq.i]=true}
    else if(a==='bqcheck'&&bq.sel!=null){
      if(bq.sel===p.a){bq.state[bq.i]='ok';const s=bqSolvedSet();s.add(bq.i);sess.set('bq-solved',[...s])}else bq.state[bq.i]='no';
    }
    else if(a==='bqgive'||a==='bqopen'){bq.state[bq.i]='give'}
    else if(a==='bqself'){const s=bqSolvedSet();s.add(bq.i);sess.set('bq-solved',[...s])}
    else if(a==='bqprev'&&bq.i>0){bqGo(bq.i-1);return}
    else if(a==='bqnext'&&bq.i<BQ.length-1){bqGo(bq.i+1);return}
    else if(a==='bqreset'){arm(t,'한 번 더 누르면 지운다',()=>{sess.set('bq-solved',[]);bq.state={};bq.hint={};renderBQ()});return}
    renderBQ();
  }
};

/* 두뇌 퀴즈 · 랭킹 도전: 보기가 있는 문제 중 10문제, 문제마다 한 번만 답한다 */
let BQmode='free',bqr=null;
const BQ_CHOICE=BQ.map((p,k)=>p.open?-1:k).filter(k=>k>=0);
function bqrNew(){bqr={phase:'ready',set:shuffle(BQ_CHOICE).slice(0,10),i:0,sel:null,ans:{},hintUsed:{},hints:0,t0:null,t1:null}}
function renderBQR(){
  const modeSeg=seg('방식','bqm',[['free','자유 풀이'],['rank','랭킹 도전 (10문제)']],BQmode);
  const headTop=`<div class="ghead"><h2>두뇌 퀴즈</h2><p>여러 방향으로 생각해야 풀리는 문제이다. 랭킹 도전은 무작위 10문제를 문제마다 한 번씩만 답한다.</p></div>
    <div class="opts">${modeSeg}${gtimeHTML()}<button class="btn sketch f-lav" type="button" data-act="rank">랭킹 보기</button></div>`;
  if(bqr.phase==='ready'){
    stage.innerHTML=headTop+`<div class="bqr-ready sketch f-lemon"><b>랭킹 도전</b>
      <ul><li>보기가 있는 문제 중 10문제가 무작위로 나온다.</li><li>문제마다 답은 한 번만 고를 수 있다. 확인을 누르면 바꿀 수 없다.</li>
      <li>힌트는 써도 되지만 횟수가 기록된다.</li><li>맞힌 수 → 힌트 횟수 → 걸린 시간 순으로 순위를 매겨요. 제한 시간은 10분이에요.</li></ul>
      <button class="btn big sketch f-mint" type="button" data-act="bqrgo">시작</button></div>`;gtimeTick();return}
  if(bqr.phase==='end'){
    const ok=Object.keys(bqr.ans).filter(k=>bqr.ans[k]).length;
    stage.innerHTML=headTop+`<div class="res-top"><div class="lbig">${ok}<small> / 10 정답</small></div>
      <div class="chips"><span class="sketch f-paper">힌트 ${bqr.hints}회</span><span class="sketch f-paper">${mmss(bqr.t1-bqr.t0)}</span></div></div>
      <div class="rwrap"><table class="rtab"><thead><tr><th>#</th><th>유형</th><th>정답</th><th>결과</th></tr></thead><tbody>
      ${bqr.set.map((q,i)=>`<tr><td>${i+1}</td><td>${BQ[q].cat}</td><td>${BQ[q].opts[BQ[q].a]}</td><td>${bqr.ans[i]?'<span class="ox o">O</span>':'<span class="ox x">X</span>'}</td></tr>`).join('')}</tbody></table></div>
      <div class="ctrl"><button class="btn big sketch f-mint reveal" type="button" data-act="bqrnew">다시 도전</button></div>`;gtimeTick();return}
  const q=bqr.set[bqr.i],p=BQ[q],answered=bqr.i in bqr.ans;
  stage.innerHTML=headTop+`<div class="bq-top"><div class="bq-dots">${bqr.set.map((_,i)=>`<span class="bq-dot${i===bqr.i?' cur':''}${i in bqr.ans?(bqr.ans[i]?' done':' miss'):''}">${i+1}</span>`).join('')}</div><span class="note">힌트 ${bqr.hints}회</span></div>
    <div class="bq"><div class="bq-card sketch f-white"><div class="bq-cat"><span class="sketch f-lav">${p.cat}</span><b>${bqr.i+1}.</b></div>
      <p class="bq-q">${p.q}</p>${bqShow(p,answered)}${bqr.hintUsed[bqr.i]?`<p class="bq-hint">힌트 · ${p.hint}</p>`:''}</div>
    <div class="bq-side">
      <div class="bq-opts">${p.opts.map((o,k)=>{let c='';if(answered&&k===p.a)c=' right';else if(answered&&bqr.sel===k)c=' wrong';else if(bqr.sel===k)c=' sel';
        return `<button type="button" class="bq-opt sketch f-white${c}" data-rq="${k}" ${answered?'disabled':''}><span class="k">${k+1}</span><span>${o}</span></button>`}).join('')}</div>
      <div class="ctrl"><button class="btn sketch f-paper" type="button" data-act="bqrhint" ${bqr.hintUsed[bqr.i]||answered?'disabled':''}>힌트 보기</button>
        ${answered?`<button class="btn big sketch f-lemon reveal" type="button" data-act="bqrnext">${bqr.i===9?'결과 보기':'다음 문제'}</button>`
          :`<button class="btn big sketch f-mint reveal" type="button" data-act="bqrcheck" ${bqr.sel==null?'disabled':''}>정답 확인</button>`}</div>
      ${answered?`<div class="bq-fb ${bqr.ans[bqr.i]?'ok':'no'}">${bqr.ans[bqr.i]?'정답!':'아쉽다. 정답은 '+(p.a+1)+'번이다.'}</div><div class="steps sketch f-lemon"><b>해설</b><p>${p.w}</p></div>`:''}
    </div></div>`;
  gtimeTick();
}
function bqrClick(t){
  if(t.dataset.rq!=null){bqr.sel=+t.dataset.rq;renderBQR();return}
  const a=t.dataset.act;
  if(a==='bqrgo'){bqr.phase='run';bqr.t0=now()}
  else if(a==='bqrnew'){bqrNew()}
  else if(a==='bqrhint'){bqr.hintUsed[bqr.i]=true;bqr.hints++}
  else if(a==='bqrcheck'&&bqr.sel!=null){bqr.ans[bqr.i]=bqr.sel===BQ[bqr.set[bqr.i]].a}
  else if(a==='bqrnext'){
    if(bqr.i<9){bqr.i++;bqr.sel=null}
    else{bqr.phase='end';bqr.t1=now();renderBQR();
      const ok=Object.values(bqr.ans).filter(Boolean).length;
      if(within(bqr.t0,bqr.t1,RK.bq.limit))rkEntry('bq',{ok,hints:bqr.hints,ms:bqr.t1-bqr.t0},`${ok}문제를 맞혔다!`);
      return}
  }
  renderBQR();
}

const lineClue=a=>{const o=[];let c=0;for(const v of a){if(v===1)c++;else if(c){o.push(c);c=0}}if(c)o.push(c);return o.length?o:[0]};
let NN={p:0,mode:'fill',st:{}};
const nnFresh=p=>({cells:p.sol.map(r=>r.map(()=>0)),t0:null,t1:null,done:false,gaveUp:false});
const nnSt=()=>{const p=NONO[NN.p];return NN.st[p.id]||(NN.st[p.id]=nnFresh(p))};

  const p=NONO[NN.p],st=nnSt(),n=p.n;

    :st.gaveUp?`<div class="result sketch f-lemon"><b>그림 공개</b><span>답을 본 기록은 랭킹에 오르지 않아요.</span></div>`:'';

const HN_LIMIT={3:2*MIN,4:3*MIN,5:5*MIN,6:8*MIN};

const HANOI={

/* ───────── 점과 선 ───────── */
const DTset={n:4};let dt=null;
function dtNew(){const n=DTset.n;dt={n,h:Array.from({length:n+1},()=>Array(n).fill(-1)),v:Array.from({length:n},()=>Array(n+1).fill(-1)),
  box:Array.from({length:n},()=>Array(n).fill(-1)),turn:0,score:[0,0],pend:null,over:false,last:null,msg:''}}
function dtBoxDone(r,c){return dt.h[r][c]>=0&&dt.h[r+1][c]>=0&&dt.v[r][c]>=0&&dt.v[r][c+1]>=0}
function renderDT(){
  const n=dt.n,L=`min(${n===3?150:118}px, calc((100vh - 410px) / ${n}))`;

    else if(C%2===0){const r=(R-1)/2,c=C/2,o=dt.v[r][c],p=dt.pend&&dt.pend.join()===['v',r,c].join();
      cells+=`<button type="button" class="de v${o>=0?' on p'+o:''}${p?' pend p'+dt.turn:''}${dt.last&&dt.last.join()===['v',r,c].join()?' last':''}" data-de="v|${r}|${c}" ${o>=0||dt.over?'disabled':''} aria-label="세로 선"></button>`}
    else{const o=dt.box[(R-1)/2][(C-1)/2];cells+=`<span class="db${o>=0?' p'+o:''}">${o>=0?(o+1)+'P':''}</span>`}
  }
  const win=dt.over?(dt.score[0]===dt.score[1]?'무승부':`${dt.score[0]>dt.score[1]?1:2}P 승리`):'';
  stage.innerHTML=`<div class="ghead"><h2>점과 선</h2><p>두 사람이 번갈아 점 사이에 선을 하나씩 긋는다. 네 변을 모두 그어 상자를 완성한 사람이 상자를 가져가고 한 번 더 긋는다. 상자를 더 많이 가져가면 승리한다.</p></div>
    <div class="opts">${seg('판','dtn',[[3,'3×3'],[4,'4×4'],[5,'5×5']],DTset.n)}<button class="btn sketch f-lav" type="button" data-act="rank">랭킹 보기</button>
      <button class="btn sketch f-paper ghost" type="button" data-act="dtnew">새 판</button></div>
    <div class="dt-wrap">
      <div class="dt-board"><div class="dt" style="--L:${L};grid-template-columns:repeat(${n},calc(var(--L) * .16) var(--L)) calc(var(--L) * .16);grid-template-rows:repeat(${n},calc(var(--L) * .16) var(--L)) calc(var(--L) * .16)">${cells}</div></div>
      <aside class="side sketch f-white">
        <h3>${dt.over?'경기 끝':'지금 차례'}</h3>
        <div class="big-turn">${dt.over?win:`<span class="who-chip sketch ${dt.turn?'f-sky':'f-peach'}">${dt.turn+1}P</span>`}</div>
        <p class="note">${dt.over?'':'선을 누르면 흐리게 보인다. 같은 선을 한 번 더 누르면 그어진다.'}</p>
        <div class="tally"><span><span class="sw p0"></span>1P 상자</span><b>${dt.score[0]}</b><span><span class="sw p1"></span>2P 상자</span><b>${dt.score[1]}</b></div>
        <p class="note">${dt.msg}</p>

}
const DOTS={
  mount(){if(!dt||dt.n!==DTset.n)dtNew();renderDT()},
  click(t){
    if(t.dataset.seg==='dtn'){DTset.n=+t.dataset.v;dtNew();renderDT();return}
    if(t.dataset.act==='dtnew'){dtNew();renderDT();return}
    if(!t.dataset.de||dt.over)return;
    const[k,r,c]=t.dataset.de.split('|'),R=+r,C=+c,key=[k,R,C];
    if(!dt.pend||dt.pend.join()!==key.join()){dt.pend=key;renderDT();return}
    dt.pend=null;(k==='h'?dt.h:dt.v)[R][C]=dt.turn;dt.last=key;let got=0;
    const around=k==='h'?[[R-1,C],[R,C]]:[[R,C-1],[R,C]];
    for(const[a,b]of around)if(a>=0&&b>=0&&a<dt.n&&b<dt.n&&dt.box[a][b]<0&&dtBoxDone(a,b)){dt.box[a][b]=dt.turn;got++}
    dt.score[dt.turn]+=got;dt.msg=got?`${dt.turn+1}P가 상자 ${got}개를 가져갔다. 한 번 더 긋자.`:'';
    if(!got)dt.turn=1-dt.turn;
    if(dt.score[0]+dt.score[1]===dt.n*dt.n){dt.over=true;dt.msg='';renderDT();
      if(dt.score[0]!==dt.score[1]){const w=dt.score[0]>dt.score[1]?1:2;rkEntry('dots',null,`${w}P 승리! (${dt.score[0]} : ${dt.score[1]})`)}return}
    renderDT();
  }
};

/* ───────── 체스 ───────── */
const CH_G={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟︎'};
const CH_NAME={K:'킹',Q:'퀸',R:'룩',B:'비숍',N:'나이트',P:'폰'};
rkDefine('chess',{game:'chess',name:'승리 횟수',rule:'체크메이트나 상대 기권으로 이긴 횟수가 많을수록 위예요.',win:true});
let ch=null;
function chNew(){const b=Array.from({length:8},()=>Array(8).fill(null)),back='RNBQKBNR';
  for(let c=0;c<8;c++){b[0][c]='b'+back[c];b[1][c]='bP';b[6][c]='wP';b[7][c]='w'+back[c]}
  ch={st:{b,turn:'w',cast:{wK:true,wQ:true,bK:true,bQ:true},ep:null},sel:null,hist:[],last:null,over:null,msg:'',cap:{w:[],b:[]},armed:null}}
function chPseudo(st,r,c,atk){
  const p=st.b[r][c];if(!p)return[];const col=p[0],t=p[1],out=[];
  const add=(rr,cc)=>{if(rr<0||rr>7||cc<0||cc>7)return false;const q=st.b[rr][cc];if(q&&q[0]===col)return false;out.push({fr:r,fc:c,tr:rr,tc:cc});return !q};
  if(t==='P'){const d=col==='w'?-1:1,start=col==='w'?6:1,last=col==='w'?0:7;
    if(!atk&&r+d>=0&&r+d<=7&&!st.b[r+d][c]){out.push({fr:r,fc:c,tr:r+d,tc:c,promo:r+d===last});
      if(r===start&&!st.b[r+2*d][c])out.push({fr:r,fc:c,tr:r+2*d,tc:c,dbl:true})}
    for(const dc of[-1,1]){const rr=r+d,cc=c+dc;if(cc<0||cc>7||rr<0||rr>7)continue;const q=st.b[rr][cc];
      if(atk){out.push({tr:rr,tc:cc});continue}
      if(q&&q[0]!==col)out.push({fr:r,fc:c,tr:rr,tc:cc,promo:rr===last});
      else if(!q&&st.ep&&st.ep[0]===rr&&st.ep[1]===cc)out.push({fr:r,fc:c,tr:rr,tc:cc,epCap:true})}
    return out}
  if(t==='N'){for(const[dr,dc]of[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]])add(r+dr,c+dc);return out}
  if(t==='K'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);
    if(!atk){const home=col==='w'?7:0,en=col==='w'?'b':'w';
      if(r===home&&c===4&&!chAttacked(st,home,4,en)){
        if(st.cast[col+'K']&&st.b[home][7]===col+'R'&&!st.b[home][5]&&!st.b[home][6]&&!chAttacked(st,home,5,en)&&!chAttacked(st,home,6,en))out.push({fr:r,fc:c,tr:home,tc:6,castle:'K'});
        if(st.cast[col+'Q']&&st.b[home][0]===col+'R'&&!st.b[home][1]&&!st.b[home][2]&&!st.b[home][3]&&!chAttacked(st,home,3,en)&&!chAttacked(st,home,2,en))out.push({fr:r,fc:c,tr:home,tc:2,castle:'Q'})}}
    return out}
  const D={B:[[1,1],[1,-1],[-1,1],[-1,-1]],R:[[1,0],[-1,0],[0,1],[0,-1]]};D.Q=D.B.concat(D.R);
  for(const[dr,dc]of D[t]){let rr=r+dr,cc=c+dc;while(add(rr,cc)){rr+=dr;cc+=dc}}
  return out;
}
function chAttacked(st,r,c,by){for(let i=0;i<8;i++)for(let j=0;j<8;j++){const p=st.b[i][j];if(p&&p[0]===by&&chPseudo(st,i,j,true).some(m=>m.tr===r&&m.tc===c))return true}return false}
function chKing(st,col){for(let i=0;i<8;i++)for(let j=0;j<8;j++)if(st.b[i][j]===col+'K')return[i,j]}
function chInCheck(st,col){const k=chKing(st,col);return chAttacked(st,k[0],k[1],col==='w'?'b':'w')}
function chApply(st,m){
  const b=st.b.map(r=>r.slice()),p=b[m.fr][m.fc];let capt=b[m.tr][m.tc];
  b[m.tr][m.tc]=m.promo?p[0]+'Q':p;b[m.fr][m.fc]=null;
  if(m.epCap){capt=b[m.fr][m.tc];b[m.fr][m.tc]=null}
  if(m.castle==='K'){b[m.tr][5]=b[m.tr][7];b[m.tr][7]=null}
  if(m.castle==='Q'){b[m.tr][3]=b[m.tr][0];b[m.tr][0]=null}
  const cast={...st.cast};if(p[1]==='K'){cast[p[0]+'K']=false;cast[p[0]+'Q']=false}
  const touch=(r,c)=>{if(r===7&&c===0)cast.wQ=false;if(r===7&&c===7)cast.wK=false;if(r===0&&c===0)cast.bQ=false;if(r===0&&c===7)cast.bK=false};
  touch(m.fr,m.fc);touch(m.tr,m.tc);
  return{st:{b,turn:st.turn==='w'?'b':'w',cast,ep:m.dbl?[(m.fr+m.tr)/2,m.fc]:null},capt};
}
function chLegalFrom(st,r,c){const p=st.b[r][c];if(!p||p[0]!==st.turn)return[];return chPseudo(st,r,c,false).filter(m=>!chInCheck(chApply(st,m).st,st.turn))}
function chAllLegal(st){const out=[];for(let i=0;i<8;i++)for(let j=0;j<8;j++)out.push(...chLegalFrom(st,i,j));return out}
const chSide=c=>c==='w'?'백':'흑';
function renderCH(){
